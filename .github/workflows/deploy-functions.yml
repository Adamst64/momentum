name: Deploy Cloud Functions and Firestore rules

on:
  push:
    branches: [main]
    paths: ['functions/**', 'firestore.rules']
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in push order. Without this, two quick pushes can
# deploy in parallel and the older commit may finish last, rolling back the newer one.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"

      - run: npx --yes firebase-tools@latest deploy --only functions,firestore:rules --project momentum-4acf1 --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
