name: Quote probe (temporary)
# Prints what Yahoo returns for a few public mutual funds (no user data). Delete after use.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/quote-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for s in FIOFX FGDIX FXAIX VFIAX SPY; do
            curl -s -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/$s?interval=1d&range=5d" | python3 -c "
          import sys,json,datetime
          r=json.load(sys.stdin)['chart']['result'][0]; m=r['meta']
          f=lambda t: datetime.datetime.utcfromtimestamp(t).strftime('%Y-%m-%d %H:%M UTC')
          print('$s', m.get('instrumentType'), 'price', m.get('regularMarketPrice'), 'time', f(m['regularMarketTime']), 'prevClose', m.get('chartPreviousClose'))
          print('   days ', [f(t) for t in r.get('timestamp',[])])
          print('   close', r['indicators']['quote'][0]['close'])
          "
          done
          date -u
