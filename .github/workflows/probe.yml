name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: functions
      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Probe
        working-directory: functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          cat > probe.js <<'JS'
          const admin = require('firebase-admin');
          admin.initializeApp({ projectId: 'momentum-4acf1' });
          (async () => {
            const key = (await admin.firestore().doc('config/finnhub').get()).data().key;
            const fh = async p => { const r = await fetch(`https://finnhub.io/api/v1/${p}&token=${key}`); const t = await r.text(); return [r.status, t.slice(0, 600)]; };
            console.log('insider', ...(await fh('stock/insider-transactions?symbol=NVDA')));
            console.log('news', ...(await fh('company-news?symbol=NVDA&from=2026-10-01&to=2026-10-24')));
            console.log('congress', ...(await fh('stock/congressional-trading?symbol=NVDA&from=2026-01-01&to=2026-10-24')));
            for (const u of ['https://house-stock-watcher-data.s3-us-west-2.amazonaws.com/data/all_transactions.json', 'https://senate-stock-watcher-data.s3-us-west-2.amazonaws.com/aggregate/all_transactions.json']) {
              try { const r = await fetch(u); const t = await r.text(); console.log('s3', u.slice(8, 40), r.status, t.length, t.slice(-400)); } catch (e) { console.log('s3 fail', e.message); }
            }
            const UA = { 'User-Agent': 'Momentum personal finance app momentum-app@users.noreply.github.com' };
            const sub = await fetch('https://data.sec.gov/submissions/CIK0001045810.json', { headers: UA });
            const j = await sub.json(); const r = j.filings.recent;
            console.log('edgar', sub.status, r.form.slice(0, 15).map((f, i) => `${r.filingDate[i]} ${f} ${r.items[i] || ''}`).join(' | '));
          })().catch(e => console.log('ERR', e.message));
          JS
          node probe.js
