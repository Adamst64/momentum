name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: functions
      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Inspect
        working-directory: functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          cat > probe.js <<'JS'
          const admin = require('firebase-admin');
          admin.initializeApp({ projectId: 'momentum-4acf1' });
          const db = admin.firestore();
          const fs = require('fs'), Module = require('module');
          const m = new Module('inv', module); m.paths = module.paths;
          m._compile(fs.readFileSync('investing.js', 'utf8') + '\nmodule.exports.fetchAbout = fetchAbout;', require('path').resolve('investing.js'));
          (async () => {
            for (const sym of ['GLD', 'GDX', 'UBER']) {
              try {
                const a = await m.exports.fetchAbout(db, sym);
                console.log(sym, JSON.stringify({ ...a, description: a.description && a.description.slice(0, 160) }));
              } catch (e) { console.log(sym, 'ERR', e.message); }
            }
          })().catch(e => { console.error('ERR', e.message); process.exit(1); });
          JS
          node probe.js
