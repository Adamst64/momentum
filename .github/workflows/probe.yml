name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm i --no-save pdf-parse@1.1.1 adm-zip@0.5.16
        working-directory: functions
      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Probe
        working-directory: functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          cat > probe.js <<'JS'
          const admin = require('firebase-admin');
          admin.initializeApp({ projectId: 'momentum-4acf1' });
          (async () => {
            const AdmZip = require('adm-zip'); const pdf = require('pdf-parse');
            const buf = Buffer.from(await (await fetch('https://disclosures-clerk.house.gov/public_disc/financial-pdfs/2026FD.zip')).arrayBuffer());
            const zip = new AdmZip(buf); console.log(zip.getEntries().map(e => e.entryName));
            const xml = zip.getEntries().find(e => e.entryName.endsWith('.xml')).getData().toString('utf8');
            const rows = [...xml.matchAll(/<Member>([\s\S]*?)<\/Member>/g)].map(m => Object.fromEntries([...m[1].matchAll(/<(\w+)>([^<]*)<\/\1>/g)].map(x => [x[1], x[2]])));
            const ptr = rows.filter(r => r.FilingType === 'P').sort((a, b) => new Date(b.FilingDate) - new Date(a.FilingDate));
            console.log('rows', rows.length, 'ptr', ptr.length, JSON.stringify(ptr.slice(0, 3)));
            for (const r of ptr.slice(0, 3)) {
              const u = `https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/${r.DocID}.pdf`;
              const p = await fetch(u); const b = Buffer.from(await p.arrayBuffer());
              try { const t = (await pdf(b)).text; console.log('PDF', r.Last, p.status, b.length, JSON.stringify(t.slice(0, 1500))); } catch (e) { console.log('pdf fail', r.Last, p.status, e.message); }
            }
          })().catch(e => console.log('ERR', e.message));
          JS
          node probe.js
