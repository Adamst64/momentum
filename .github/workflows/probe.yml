name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Siri endpoint
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o body.txt -w '%{http_code}' 'https://us-central1-momentum-4acf1.cloudfunctions.net/siriAdd?item=milk')
            echo "try $i: $code $(cat body.txt | head -c 200)"
            if [ "$code" = "401" ]; then exit 0; fi
            sleep 15
          done
